<!DOCTYPE html>
<html>
<head>
  <title>Logo Test</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .box-dark { background: #000; padding: 20px; margin-bottom: 20px; border-radius: 8px; color: #fff; }
    .box-light { background: #fff; padding: 20px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; color: #000; }
    img { max-height: 80px; margin-right: 20px; vertical-align: middle; }
  </style>
</head>
<body>
  <h2>DARK BACKGROUND (#000000)</h2>
  <div class="box-dark">
    <div><strong>logo-text-1.png:</strong> <img src="../assets/logo-text-1.png"></div>
    <div style="margin-top:15px"><strong>logo-text-2.png:</strong> <img src="../assets/logo-text-2.png"></div>
    <div style="margin-top:15px"><strong>logo-haichain-si.png:</strong> <img src="../assets/logo-haichain-si.png"></div>
    <div style="margin-top:15px"><strong>icon.png:</strong> <img src="../assets/icon.png"></div>
  </div>

  <h2>LIGHT BACKGROUND (#FFFFFF)</h2>
  <div class="box-light">
    <div><strong>logo-text-1.png:</strong> <img src="../assets/logo-text-1.png"></div>
    <div style="margin-top:15px"><strong>logo-text-2.png:</strong> <img src="../assets/logo-text-2.png"></div>
    <div style="margin-top:15px"><strong>logo-haichain-si.png:</strong> <img src="../assets/logo-haichain-si.png"></div>
    <div style="margin-top:15px"><strong>icon.png:</strong> <img src="../assets/icon.png"></div>
  </div>
</body>
</html>
